[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtg-knockout"
version = "0.1.0"
description = "A small, fast known-background matting model for print-on-demand graphics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "pillow>=10.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "tqdm>=4.66",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/vaybel/dtg-knockout"

[tool.setuptools.packages.find]
include = ["knockout*"]
